name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the checkout and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: nightlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Type check, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to immutable commit SHAs (with the human-readable
      # version in a comment) so a moved tag cannot change what runs in CI.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify the built manifest is minimal
        run: |
          node -e '
            const m = require("./dist/manifest.json");
            if (m.manifest_version !== 3) throw new Error("expected Manifest V3");
            if (JSON.stringify(m.permissions) !== JSON.stringify(["storage"])) throw new Error("unexpected permissions: " + JSON.stringify(m.permissions));
            if ((m.host_permissions ?? []).length !== 0) throw new Error("host permissions must stay empty");
            console.log("manifest OK:", JSON.stringify({ permissions: m.permissions, host_permissions: m.host_permissions }));
          '

      - name: Upload extension bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightlens-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Verification"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Type check | ${{ job.status }} |"
            echo "| Unit/integration tests | ${{ job.status }} |"
            echo "| Production build | ${{ job.status }} |"
            echo ""
            echo "Browser tests run in the \`e2e\` job."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests (Chromium + extension)
    needs: verify
    runs-on: ubuntu-24.04
    # Job-level elevation, for one purpose: posting the failure output as a PR comment.
    # The workflow as a whole stays read-only; the built extension requests nothing extra.
    permissions:
      contents: read
      pull-requests: write
    # 42 tests x 45s timeout x 1 retry is the worst case; the budget leaves room for the install.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The extension under test is built from the same commit the unit job verified.
      # Output is kept so the failure can be published below even where log download is blocked.
      - name: Build and run Playwright suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright-output.txt

      # Keep the evidence for a suite that has never run in CI: traces, screenshots and the report.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Surface the failure in two places that survive restricted networks: a check annotation
      # (readable through the checks API) and, on pull requests, a comment with the full output.
      - name: Publish failure details
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f playwright-output.txt ]; then echo "no captured output"; exit 0; fi
          python3 - <<'ANN'
          import re
          text = open('playwright-output.txt', encoding='utf-8', errors='replace').read()
          blocks = re.split(r'\n\s+(?=\d+\) )', text)
          failures = [b.strip() for b in blocks if re.match(r'\d+\) ', b.strip())]
          for block in failures[:5]:
              message = block[:900].replace('%', '%25').replace('\r', '').replace('\n', ' ')
              print(f"::error title=Playwright failure::{message}")
          print(f"captured {len(failures)} failure block(s) as annotations")
          ANN
          if [ -n "$PR_NUMBER" ]; then
            { echo "### Playwright failure output"; echo '```'; tail -n 200 playwright-output.txt; echo '```'; } > failure-comment.md
            gh pr comment "$PR_NUMBER" --body-file failure-comment.md || echo "could not comment (non-fatal)"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Browser tests"
            echo ""
            echo "Result: ${{ job.status }}"
            echo ""
            echo "Failure output is published as a check annotation and, on pull requests, as a comment."
            echo "Artifacts (traces, screenshots, HTML report) are uploaded when the job fails."
          } >> "$GITHUB_STEP_SUMMARY"
